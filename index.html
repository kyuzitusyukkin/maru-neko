<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0b26">
<title>ぷにぷにきゃっとドロップ</title>
<meta name="description" content="まるまった猫を落として、くっつけて、大きな猫に育てよう。">
<meta name="author" content="otoyogames">
<meta property="og:type" content="website">
<meta property="og:title" content="ぷにぷにきゃっとドロップ">
<meta property="og:description" content="まるまった猫を落として、くっつけて、大きな猫に育てよう。">
<meta property="og:image" content="https://kyuzitusyukkin.github.io/maru-neko/ogp.jpg">
<meta property="og:url" content="https://kyuzitusyukkin.github.io/maru-neko/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="ぷにぷにきゃっとドロップ">
<meta name="twitter:description" content="まるまった猫を落として、くっつけて、大きな猫に育てよう。">
<meta name="twitter:image" content="https://kyuzitusyukkin.github.io/maru-neko/ogp.jpg">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="icon" href="data:,">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@400;500;700&amp;display=swap" rel="stylesheet">
<style>
*{-webkit-tap-highlight-color:transparent}
canvas,button,[role=button]{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{margin:0}
button{font-family:inherit}
@keyframes cd-pop{0%{transform:scale(0.6);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes cd-bump{0%{transform:scale(1)}40%{transform:scale(1.25)}100%{transform:scale(1)}}
.cd-bump{animation:cd-bump 0.35s ease-out}
.cd-help > *{flex-shrink:0}
@keyframes kari-fly{0%{transform:translate(0,10px) scale(0.6);opacity:0}25%{transform:translate(0,0) scale(1.1);opacity:1}55%{transform:translate(0,0) scale(1);opacity:1}100%{transform:translate(143px,-406px) scale(0.45);opacity:0.2}}
@keyframes cd-wiggle{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}
@keyframes cd-wiggle2{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}
@keyframes kari-bump{0%{transform:scale(1)}40%{transform:scale(1.28)}100%{transform:scale(1)}}

/* コンボ表示（ぷにぷにきゃっとソートと同じ） */
@keyframes mn-combo{0%{opacity:0;transform:scale(.4)}15%{opacity:1;transform:scale(1.15,.9)}25%{transform:scale(.95,1.05)}35%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
@keyframes mn-combo2{0%{opacity:0;transform:scale(.4)}15%{opacity:1;transform:scale(1.15,.9)}25%{transform:scale(.95,1.05)}35%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:translateY(-10px)}}
.mn-cn{font-size:36px;margin-left:2px;background:linear-gradient(140deg,#ffd3f1,#d6dbff 50%,#c4fbef);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 6px rgba(255,184,234,.8))}

/* ===== slime skin ===== */
@keyframes pz-drop{0%{transform:translateY(-26px);opacity:0}60%{transform:translateY(0) scale(1,1);opacity:1}78%{transform:translateY(0) scale(1.2,.78)}90%{transform:scale(.94,1.06)}100%{transform:none;opacity:1}}
@keyframes pz-pop{0%{transform:scale(.4)}55%{transform:scale(1.38,1.08)}75%{transform:scale(1.02,1.22)}100%{transform:scale(1.1)}}
@keyframes pz-poof{0%{transform:scale(1);opacity:1}35%{transform:scale(1.4,1.15);opacity:1}100%{transform:scale(.1,.3);opacity:0;filter:blur(2px)}}
@keyframes slime-wob{0%,100%{transform:scale(1,1)}30%{transform:scale(1.06,.94)}65%{transform:scale(.97,1.03)}}
@keyframes slime-bw{0%,100%{border-radius:50%}33%{border-radius:54% 46% 50% 50%/46% 54% 46% 54%}66%{border-radius:46% 54% 52% 48%/54% 46% 54% 46%}}
.pz-cell svg{animation:slime-wob 2.4s ease-in-out infinite;transform-origin:50% 80%}
button:not([style*="transform"]),a[href]:not([style*="transform"]){transition:transform .45s cubic-bezier(.25,1.9,.5,1)}
button:not([style*="transform"]):active,a[href]:not([style*="transform"]):active{transform:scale(1.1,.86);transition:transform .07s}
button[style*="border-radius"]:not([style*="transparent"]):not([style*="background: none"]),a[href][style*="border-radius"]:not([style*="transparent"]){box-shadow:inset 0 2px 4px rgba(255,255,255,.28),inset 0 -3px 6px rgba(0,0,0,.18)}
.slime-bub{position:absolute;border-radius:50%;pointer-events:none;animation:slime-bw 2s ease-in-out infinite;background:radial-gradient(circle at 30% 26%,rgba(255,255,255,.9) 0 9%,rgba(255,255,255,0) 11%),radial-gradient(circle at 50% 55%,rgba(60,45,110,.15) 0%,rgba(70,55,130,.45) 68%,rgba(220,200,255,.55) 100%);border:1px solid rgba(255,205,240,.75);box-shadow:inset -3px -3px 6px rgba(255,170,230,.45),inset 3px 2px 5px rgba(160,255,240,.4),0 0 8px rgba(200,180,255,.25)}
</style>

<style>
html,body{margin:0;height:100%;background:#0b0b26;overflow:hidden;overscroll-behavior:none;touch-action:manipulation}
#stage{position:fixed;left:50%;top:50%;width:390px;height:708px;overflow:hidden;transform-origin:50% 50%}
#dc-root{width:390px;height:844px}
</style>
</head>
<body>
<div id="stage"><div id="dc-root"></div></div>
<template id="dc-template">

<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: radial-gradient(circle at 20% 28%, rgba(255,150,220,0.16), transparent 45%), radial-gradient(circle at 85% 62%, rgba(120,170,255,0.16), transparent 50%), linear-gradient(180deg, #0b0b26 0%, #1d1640 50%, #2b1d4f 100%); font-family: 'Zen Maru Gothic', sans-serif; color: {{t.ink}}; box-sizing: border-box">

  <div style="display: flex; align-items: center; justify-content: space-between; padding: {{headPad}} 12px 6px 12px">
    <sc-if value="{{embedded}}" hint-placeholder-val="{{ false }}">
    <button aria-label="もどる" onClick="{{onHome}}" style="width: 44px; height: 44px; border-radius: 22px; border: none; background: {{t.soft}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.ink}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </button>
    </sc-if>
    <sc-if value="{{standalone}}" hint-placeholder-val="{{ true }}">
    <a href="Game.dc.html" aria-label="もどる" style="width: 44px; height: 44px; border-radius: 22px; background: {{t.soft}}; display: flex; align-items: center; justify-content: center; text-decoration: none">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.ink}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg>
    </a>
    </sc-if>
    <div style="display: flex; align-items: center; gap: 8px">
      <h1 style="margin: 0; display: flex; flex-direction: column; align-items: center; line-height: 1.1; font-weight: 700; color: {{t.ink}}"><span style="font-size: 11px">ぷにぷに</span><span style="font-size: 15px">きゃっとドロップ</span></h1>
      <button aria-label="あそびかた" onClick="{{openHelp}}" style="width: 28px; height: 28px; border-radius: 14px; border: 1.5px solid {{t.border}}; background: {{t.surface}}; color: {{t.ink}}; font-size: 14px; font-weight: 700; cursor: pointer; padding: 0">?</button>
      <button aria-label="おとの大きさ" onClick="{{openVol}}" style="width: 28px; height: 28px; border-radius: 14px; border: 1.5px solid {{t.border}}; background: {{t.surface}}; cursor: pointer; padding: 0; display: flex; align-items: center; justify-content: center"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.ink}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V6l10-2v12"></path><circle cx="6.5" cy="18" r="2.5" fill="{{t.ink}}"></circle><circle cx="16.5" cy="16" r="2.5" fill="{{t.ink}}"></circle></svg></button>
    </div>
    <div style="position: relative; z-index: {{pillZ}}; height: 32px; padding: 0 12px; border-radius: 16px; background: {{t.surface}}; border: 1px solid {{t.border}}; display: flex; align-items: center; gap: 5px; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; animation: {{bumpAn}}">
      <svg width="18" height="18" viewBox="0 0 24 24" role="img" aria-label="カリカリ"><path d="M2.5 12 C5 7.5 11 6.5 15.5 10.5 L20.5 6.5 L19.5 12 L20.5 17.5 L15.5 13.5 C11 17.5 5 16.5 2.5 12 Z" fill="#C98A4B" stroke="#8A5A2B" stroke-width="1.2" stroke-linejoin="round"></path><circle cx="6.3" cy="11.2" r="1.1" fill="#5A3A1B"></circle></svg>
      {{kariLabel}}
    </div>
  </div>

  <!-- スコア・ベスト・ネクスト -->
  <div style="display: grid; grid-template-columns: 1fr 1fr 74px; gap: 8px; padding: 6px 25px 10px 25px">
    <div style="background: {{t.surface}}; border-radius: 14px; padding: 6px 12px; display: flex; flex-direction: column">
      <span style="font-size: 11.5px; color: {{t.sub}}">スコア</span>
      <span class="{{scoreCls}}" style="font-size: 24px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums; transform-origin: left center">{{score}}</span>
    </div>
    <div style="background: {{t.surface}}; border-radius: 14px; padding: 6px 12px; display: flex; flex-direction: column">
      <span style="font-size: 11.5px; color: {{t.sub}}">ベスト</span>
      <span style="font-size: 24px; font-weight: 700; line-height: 1.15; font-variant-numeric: tabular-nums">{{best}}</span>
    </div>
    <div style="background: {{t.surface}}; border-radius: 14px; padding: 6px 0 4px 0; display: flex; flex-direction: column; align-items: center">
      <span style="font-size: 11.5px; color: {{t.sub}}">ネクスト</span>
      <canvas ref="{{nextRef}}" width="88" height="68" aria-label="つぎの猫" style="width: 44px; height: 34px"></canvas>
    </div>
  </div>

  <!-- 箱 -->
  <div style="display: flex; justify-content: center">
    <div style="position: relative; margin-top: 8px; width: 340px; height: 532px; border-radius: 24px; background: radial-gradient(1.3px 1.3px at 14% 30%, rgba(255,255,255,0.75), transparent), radial-gradient(1px 1px at 72% 12%, rgba(255,255,255,0.7), transparent), radial-gradient(1.5px 1.5px at 86% 44%, rgba(255,255,255,0.6), transparent), radial-gradient(1px 1px at 38% 58%, rgba(255,255,255,0.55), transparent), radial-gradient(1.2px 1.2px at 22% 76%, rgba(255,255,255,0.5), transparent), radial-gradient(1px 1px at 64% 84%, rgba(255,255,255,0.5), transparent), linear-gradient(180deg, #3E3170 0%, #6A4F92 55%, #A8779F 100%); box-sizing: content-box; overflow: hidden">
      <canvas ref="{{canvasRef}}" width="680" height="1064" role="img" aria-label="ぷにぷにきゃっとドロップの箱。タップした場所に猫を落とします" onPointerDown="{{onDown}}" onPointerMove="{{onMoveP}}" onPointerUp="{{onUp}}" onPointerCancel="{{onCancel}}" style="position: absolute; inset: 0; width: 340px; height: 532px; touch-action: none; cursor: pointer"></canvas>
      <div role="status" style="position: absolute; left: 0; right: 0; top: 10px; z-index: 3; text-align: center; pointer-events: none; opacity: 0; transform-origin: 50% 50%; font-size: 22px; font-weight: 700; line-height: 1.1; color: #FFFFFF; text-shadow: 0 0 8px rgba(255,184,234,0.9), 0 0 16px rgba(166,255,240,0.5); animation: {{comboAn}}">Combo <b class="mn-cn">{{comboN}}</b><div style="font-size: 14px; margin-top: 2px">+{{comboBonus}}</div></div>
    </div>
  </div>


  <!-- あそびかた -->
  <sc-if value="{{helpOn}}" hint-placeholder-val="{{ false }}">
  <div style="position: absolute; inset: 0; z-index: 30; background: rgba(10,8,18,0.72); display: flex; align-items: center; justify-content: center; padding: 0 18px 92px 18px">
    <div style="position: relative; width: 100%">
      <button aria-label="とじる" onClick="{{closeHelp}}" style="position: absolute; left: -10px; top: -10px; z-index: 2; width: 40px; height: 40px; border-radius: 20px; border: 1px solid {{t.border}}; background: {{t.modal}}; box-shadow: 0 2px 8px rgba(0,0,0,0.25); display: flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.ink}}" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
    <div role="dialog" aria-label="あそびかた" class="cd-help" style="width: 100%; max-height: 640px; overflow-y: auto; background: {{t.modal}}; border: 1px solid {{t.border}}; border-radius: 22px; padding: 20px 18px 16px 18px; display: flex; flex-direction: column; gap: 14px; animation: cd-pop 0.2s ease-out; box-sizing: border-box">
      <div style="font-size: 17px; font-weight: 700; padding-left: 30px">あそびかた</div>
      <ul style="margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 13.5px; line-height: 1.6">
        <li>箱の上を指でなぞって場所を決め、はなすと猫が落ちます</li>
        <li>同じ猫どうしがくっつくと、1つ大きな猫に育ちます</li>
        <li>点線より上に猫がはみ出したままになると、おしまい</li>
        <li>キングキャットどうしをくっつけると、2匹とも消えてボーナス</li>
        <li>続けて猫がくっつくとコンボ！コンボが続くほどボーナス点が増えます</li>
      </ul>
      <div style="font-size: 14px; font-weight: 700; margin-top: 4px">猫の育ち方</div>
      <canvas ref="{{chainRef}}" width="660" height="400" aria-label="しろねこ、ピーチ、くろねこ、さくら、そらいろ、レモン、ラベンダー、ぶどう、オーロラ、キングキャットの順に大きくなる" style="width: 100%; max-width: 330px; align-self: center"></canvas>
      <div style="font-size: 14px; font-weight: 700; margin-top: 4px">もらえるカリカリ</div>
      <div style="border-radius: 14px; background: {{t.surface}}; display: flex; flex-direction: column">
        <sc-for list="{{tiers}}" as="tr" hint-placeholder-count="5">
          <div style="display: flex; justify-content: space-between; padding: 9px 14px; border-top: {{tr.line}}; font-size: 13.5px; font-variant-numeric: tabular-nums"><span>{{tr.score}}点〜</span><span style="font-weight: 700">{{tr.kari}}カリカリ</span></div>
        </sc-for>
      </div>
      <div style="font-size: 12px; color: {{t.sub}}">1回のプレイで最大{{maxKari}}カリカリ</div>
      <div style="font-size: 11.5px; color: {{t.sub}}; border-top: 1px solid {{t.border}}; padding-top: 10px">BGM：BGMer　https://bgmer.net</div>
    </div>
    </div>
  </div>
  </sc-if>

  <!-- おとの大きさ（ぷにぷにきゃっとソートと同じ） -->
  <sc-if value="{{volOn}}" hint-placeholder-val="{{ false }}">
  <div style="position: absolute; inset: 0; z-index: 30; background: rgba(10,8,18,0.72); display: flex; align-items: center; justify-content: center; padding: 0 28px 92px 28px">
    <div role="dialog" aria-label="おとの大きさ" style="width: 100%; background: {{t.modal}}; border: 1px solid {{t.border}}; border-radius: 22px; padding: 20px 20px 18px 20px; display: flex; flex-direction: column; gap: 16px; box-sizing: border-box; animation: cd-pop 0.2s ease-out">
      <div style="font-size: 17px; font-weight: 700; text-align: center">おとの大きさ</div>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700"><span style="display: flex; justify-content: space-between"><span>BGM</span><span style="font-variant-numeric: tabular-nums">{{volBgm}}</span></span><input type="range" min="0" max="100" step="5" value="{{volBgm}}" onChange="{{onBgm}}" style="width: 100%; height: 32px; accent-color: #C9B8FF"></label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; font-weight: 700"><span style="display: flex; justify-content: space-between"><span>こうかおん</span><span style="font-variant-numeric: tabular-nums">{{volSe}}</span></span><input type="range" min="0" max="100" step="5" value="{{volSe}}" onChange="{{onSe}}" onPointerUp="{{seTest}}" style="width: 100%; height: 32px; accent-color: #A6FFF0"></label>
      <button onClick="{{closeVol}}" style="height: 46px; border-radius: 23px; border: none; background: {{t.accent}}; color: #FFFFFF; font-size: 15px; font-weight: 700; cursor: pointer">とじる</button>
    </div>
  </div>
  </sc-if>

  <!-- 動画広告（モック） -->
  <sc-if value="{{adOn}}" hint-placeholder-val="{{ false }}">
  <div role="dialog" aria-label="動画広告" style="position: absolute; inset: 0; z-index: 40; background: #0E0B14; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; color: #ECEBF0">
    <div style="position: absolute; left: 16px; top: 64px; font-size: 12px; padding: 3px 8px; border-radius: 6px; background: rgba(255,255,255,0.15)">広告</div>
    <sc-if value="{{adWait}}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; right: 16px; top: 60px; font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 14px; background: rgba(255,255,255,0.15)">あと {{adLeft}} 秒</div>
    </sc-if>
    <sc-if value="{{adDone}}" hint-placeholder-val="{{ false }}">
    <button aria-label="広告をとじる" onClick="{{closeAd}}" style="position: absolute; right: 16px; top: 56px; width: 40px; height: 40px; border-radius: 20px; border: none; background: rgba(255,255,255,0.2); color: #FFFFFF; font-size: 20px; cursor: pointer">×</button>
    </sc-if>
    <div style="width: 300px; height: 300px; border-radius: 24px; background: linear-gradient(160deg, #3A2860, #6B3F7A); display: flex; align-items: center; justify-content: center; font-size: 15px; color: rgba(255,255,255,0.7)">ここに動画広告が流れます</div>
    <div style="width: 300px; height: 6px; border-radius: 3px; background: rgba(255,255,255,0.15); overflow: hidden"><div style="width: {{adPct}}; height: 6px; background: #F2A0B8"></div></div>
  </div>
  </sc-if>

  <!-- 上限に達したら：サブスクのおすすめ -->
  <sc-if value="{{subOn}}" hint-placeholder-val="{{ false }}">
  <div style="position: absolute; inset: 0; bottom: {{ovBottom}}; z-index: 16; background: rgba(20,16,28,0.55); display: flex; align-items: center; justify-content: center; padding: 0 32px">
    <div role="dialog" aria-label="サブスク" style="width: 100%; background: {{t.bg}}; border-radius: 22px; padding: 24px 20px 18px 20px; display: flex; flex-direction: column; align-items: center; gap: 12px; box-sizing: border-box">
      <div style="font-size: 14px; font-weight: 700; color: {{t.sub}}">{{subTitle}}</div>
      <div style="font-size: 20px; font-weight: 700; color: {{t.ink}}">広告なしで、無制限に遊べる</div>
      <div style="padding: 10px 20px; border-radius: 16px; background: linear-gradient(135deg, #F6D7E2, #E9DDF6); font-size: 15px; font-weight: 700; color: #5B3F94">サブスク　月額1,650円</div>
      <button onClick="{{joinSub}}" style="margin-top: 4px; width: 100%; height: 50px; border-radius: 25px; border: none; background: #5B3F94; color: #FFFFFF; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit">サブスクに登録する</button>
      <sc-if value="{{embedded}}" hint-placeholder-val="{{ false }}">
      <button onClick="{{onHome}}" style="height: 36px; padding: 0 18px; border: none; background: none; color: {{t.sub}}; font-size: 13.5px; font-weight: 700; cursor: pointer; font-family: inherit">やめる</button>
      </sc-if>
      <sc-if value="{{standalone}}" hint-placeholder-val="{{ true }}">
      <a href="Game.dc.html" style="height: 36px; padding: 0 18px; display: flex; align-items: center; color: {{t.sub}}; font-size: 13.5px; font-weight: 700; text-decoration: none">やめる</a>
      </sc-if>
    </div>
  </div>
  </sc-if>

  <!-- 参加するときにカリカリを3つ払う -->
  <sc-if value="{{gateOn}}" hint-placeholder-val="{{ false }}">
  <div style="position: absolute; inset: 0; bottom: {{ovBottom}}; z-index: 15; background: rgba(20,16,28,0.55); display: flex; align-items: center; justify-content: center; padding: 0 32px">
    <div role="dialog" aria-label="ぷにぷにきゃっとドロップに参加" style="width: 100%; background: {{t.bg}}; border-radius: 22px; padding: 22px 20px 18px 20px; display: flex; flex-direction: column; align-items: center; gap: 14px; box-sizing: border-box">
      <div style="font-size: 18px; font-weight: 700; color: {{t.ink}}">ぷにぷにきゃっとドロップ</div>
      <sc-if value="{{gateNormal}}" hint-placeholder-val="{{ true }}">
      <button onClick="{{payGate}}" disabled="{{gateNo}}" style="width: 100%; height: 50px; border-radius: 25px; border: none; background: {{gateBg}}; color: #FFFFFF; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit">{{gateBtn}}</button>
      </sc-if>
      <sc-if value="{{gateExtra}}" hint-placeholder-val="{{ false }}">
      <sc-if value="{{gateCanAd}}" hint-placeholder-val="{{ true }}">
      <button onClick="{{playAd}}" disabled="{{adNo}}" style="width: 100%; height: 52px; border-radius: 26px; border: none; background: {{adBg}}; color: #FFFFFF; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px"><sc-if value="{{adIcon}}" hint-placeholder-val="{{ true }}"><svg width="16" height="16" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" fill="#FFFFFF"></path></svg></sc-if><span>{{adLabel}}</span></button>
      </sc-if>

<script type="text/plain" id="dc-logic">
// まるねこ：丸まった猫を箱に落として、同じ猫どうしがくっつくと1段階大きく（太く）なる。いちばん上は「デブデカ猫」
// 物理は自前の円の当たり判定（重力・壁・床・円どうしの押し合い）。描画は canvas
const W = 340, H = 532, LINE = 106, DROP_Y = 58, SCALE = 2, LID = 12;
const CATS = [
  { name: 'しろねこ', r: 14, fur: '#FFFFFF', edge: '#C9C2D2', ear: '#F2C3CF', spot: '#8E8A99' },
  { name: 'ピーチ', r: 19, fur: '#F4C48C', edge: '#C98A4B', ear: '#F7D3B0', bib: '#FFFFFF' },
  { name: 'くろねこ', r: 25, fur: '#2B2433', edge: '#6A6278', ear: '#4A3E52' },
  { name: 'さくら', r: 31, fur: '#9A96A6', edge: '#6F6B7C', ear: '#C9C4D2', stripe: '#6F6B7C' },
  { name: 'そらいろ', r: 38, fur: '#F3E6D2', edge: '#B89C80', ear: '#6B4A3A', point: '#6B4A3A' },
  { name: 'レモン', r: 46, fur: '#D9773A', edge: '#9A4E1C', ear: '#F2B48A', stripe: '#A8521E', bold: true },
  { name: 'ラベンダー', r: 54, fur: '#2B2433', edge: '#6A6278', ear: '#4A3E52', hachi: true },
  { name: 'ぶどう', r: 63, fur: '#FBF6EE', edge: '#D9CBB8', ear: '#F4C3D0', calico: true },
  { name: 'オーロラ', r: 73, fur: '#EED9B8', edge: '#C9AE86', ear: '#F4C3D0' },
  { name: 'キングキャット', r: 85, fur: '#8E8A99', edge: '#5E5A6A', ear: '#B9B4C2', stripe: '#6F6B7C', crown: true }
];
const PTS = [0, 1, 3, 6, 10, 15, 21, 28, 36, 45, 55];
// スコアでもらえるカリカリ（1,000点でハートパズルのクリアと同じ5。時間がかかる分、上限は10）
const TIERS = [[200, 1], [400, 2], [600, 3], [800, 4], [1000, 5], [1300, 6], [1600, 7], [2000, 8], [2500, 9], [3000, 10]];
const kariFor = (sc) => TIERS.reduce((a, [p, k]) => (sc >= p ? k : a), 0);
const lighten = (hex, k) => { const n = parseInt(hex.slice(1), 16); const f = (c) => Math.round(c + (255 - c) * k); return `rgb(${f(n >> 16)},${f((n >> 8) & 255)},${f(n & 255)})`; };

// まるねこの猫（ぷにぷにきゃっとソートの猫と同じ色・柄・グラデ・顔）。SVGで1回だけ作って画像にし、canvasに貼る
// SVGの座標：体の中心 (60,61)・半径 33.3（ソートの猫と同じ大きさの単位）。canvas の (0,0) は SVG の (60,60)
const MN = (() => {
  const st5 = (x, y, r) => { let d = ''; for (let k = 0; k < 10; k++) { const a = -Math.PI / 2 + k * Math.PI / 5, rr = k % 2 ? r * 0.4 : r; d += (k ? 'L' : 'M') + (x + rr * Math.cos(a)).toFixed(1) + ' ' + (y + rr * Math.sin(a)).toFixed(1); } return d + 'Z'; };
  const sak = (x, y, k, r = 0) => `<g transform="translate(${x} ${y}) rotate(${r}) scale(${k})">${[0, 72, 144, 216, 288].map((a) => `<ellipse rx="1.9" ry="3" cy="-3" transform="rotate(${a})"/>`).join('')}<circle r="1.1" fill="#ffc2e0"/></g>`;
  const paw = (x, y, k, r = 0) => `<g transform="translate(${x} ${y}) rotate(${r}) scale(${k})"><ellipse cx="0" cy="2" rx="3.4" ry="2.8"/><circle cx="-3.1" cy="-2.7" r="1.55"/><circle cx="0" cy="-4.3" r="1.55"/><circle cx="3.1" cy="-2.7" r="1.55"/></g>`;
  const spk = (x, y, s) => `<path d="M${x} ${y - s}Q${x + s * 0.18} ${y - s * 0.18} ${x + s} ${y}Q${x + s * 0.18} ${y + s * 0.18} ${x} ${y + s}Q${x - s * 0.18} ${y + s * 0.18} ${x - s} ${y}Q${x - s * 0.18} ${y - s * 0.18} ${x} ${y - s}Z"/>`;
  const PAT = {
    hachi: `<path d="M14 14H106V63Q92 66 81 57Q70 47 60 34Q50 47 39 57Q28 66 14 63Z" fill="#a9a9bf" opacity=".6"/>`,
    tora: `<g stroke="#ee8456" stroke-linecap="round" fill="none" opacity=".5"><path d="M54 30V39M60 29V41M66 30V39" stroke-width="2.6"/><path d="M28 66Q36 68 41 64M30 77Q38 80 43 75M35 87Q41 90 46 86M92 66Q84 68 79 64M90 77Q82 80 77 75M85 87Q79 90 74 86" stroke-width="3.2"/></g>`,
    sakura: `<g fill="#fff6fb" opacity=".7">${sak(40, 71, 1.1, 10)}${sak(79, 69, 0.9, 40)}${sak(58, 85, 1.2, -20)}${sak(81, 83, 0.8, 5)}${sak(41, 86, 0.75, 30)}<ellipse cx="67" cy="76" rx="1.6" ry="2.6" transform="rotate(35 67 76)"/><ellipse cx="70" cy="92" rx="1.5" ry="2.4" transform="rotate(-30 70 92)"/></g>`,
    cloud: `<g fill="#ffffff" opacity=".68"><path d="M22 86Q26 78 35 81Q39 73 50 77Q58 72 64 79Q74 75 78 82Q88 79 98 86V100H22Z"/><path d="M70 67Q72 62 77 64Q80 59 85 62Q91 61 92 67Z" opacity=".85"/><path d="M30 72Q32 67 37 69Q40 65 44 69Q48 69 48 73H30Z" opacity=".8"/></g>`,
    argyle: (() => { let d = ''; for (let j = 0; j < 2; j++) for (let i = -1; i < 6; i++) d += `M${20 + 20 * i} ${69 + 28 * j - 14}L${30 + 20 * i} ${69 + 28 * j}L${20 + 20 * i} ${69 + 28 * j + 14}L${10 + 20 * i} ${69 + 28 * j}Z`; return `<path d="${d}" fill="#ffffff" opacity=".85"/>`; })(),
    star: `<g fill="#ffffff" opacity=".7">${[[42, 69], [60, 67], [78, 69], [50, 80], [70, 80], [40, 84], [80, 84], [60, 91]].map(([x, y]) => `<path d="${st5(x, y, 4.2)}"/>`).join('')}</g>`,
    paw: `<g fill="#ffffff" opacity=".42">${paw(46, 74, 1.8, -8)}${paw(74, 74, 1.8, 8)}</g>`,
    sky: `<g fill="#fff" opacity=".6">${spk(42, 72, 3.4)}${spk(77, 84, 2.6)}${spk(66, 70, 1.6)}<circle cx="80" cy="62" r="1"/><circle cx="40" cy="85" r="1.2"/><circle cx="60" cy="92" r=".9"/><circle cx="86" cy="73" r=".8"/><circle cx="33" cy="64" r=".8"/><circle cx="54" cy="79" r=".7"/></g>`,
  };
  // 小さい順（同じ猫2匹で1つ上へ）
  const LOOK = [
    { name: 'しろねこ', c0: '#ffffff', c1: '#d4d8f4', eye: '#7f96ff', pat: 'hachi', ear: '#a9a9bf', earA: 0.6 },
    { name: 'ピーチ', c0: '#fff1e8', c1: '#ffb596', eye: '#7a4aa0', pat: 'tora', ear: '#ee8456', earA: 0.3 },
    { name: 'くろねこ', c0: '#3a2f5e', c1: '#0e0a1e', eye: '#7ff5d0', dark: 1 },
    { name: 'さくら', c0: '#ffe6f4', c1: '#ffa6d4', eye: '#6a4bb8', pat: 'sakura' },
    { name: 'そらいろ', c0: '#d9f4ff', c1: '#56bdf0', eye: '#3b3a8c', pat: 'cloud' },
    { name: 'レモン', c0: '#fffbe2', c1: '#ffe07a', eye: '#8a5ad0', pat: 'argyle' },
    { name: 'ラベンダー', c0: '#f1e8ff', c1: '#b39bff', eye: '#4b3a8c', pat: 'star' },
    { name: 'ぶどう', c0: '#a27cf0', c1: '#4a2a9a', eye: '#ffd3f1', dark: 1, pat: 'paw' },
    { name: 'オーロラ', aur: 1, eye: '#5b3fb8' },
    { name: 'キングキャット', c0: '#5361d6', c1: '#1c2266', eye: '#ffe9a0', dark: 1, pat: 'sky' },
  ];
  const svg = (lv) => {
    const L = LOOK[lv], fat = lv / 9, R = 33.3;
    const rx = (R * (1 + fat * 0.06)).toFixed(2), ry = (R * 0.98).toFixed(2);
    const ear = (s) => `M${60 + s * R * 0.82} ${60 - R * 0.42}L${60 + s * R * (0.66 - fat * 0.04)} ${60 - R * (1.28 - fat * 0.08)}L${60 + s * R * 0.16} ${60 - R * 0.86}Z`;
    const fill = 'url(#g)';
    const grad = L.aur ? `<linearGradient id="g" x1="0" y1="0" x2=".6" y2="1"><stop offset="0" stop-color="#ffd6f0"/><stop offset=".5" stop-color="#cdd4ff"/><stop offset="1" stop-color="#b8fbe9"/></linearGradient>`
      : `<radialGradient id="g" cx="38%" cy="35%" r="75%"><stop offset="0" stop-color="${L.c0}"/><stop offset="1" stop-color="${L.c1}"/></radialGradient>`;
    const earPaint = (s) => `<path d="${ear(s)}" fill="${fill}"/>` + (L.ear ? `<path d="${ear(s)}" fill="${L.ear}" opacity="${L.earA}"/>` : '');
    const body = `<ellipse cx="60" cy="61" rx="${rx}" ry="${ry}"/>`;

    this.fx.forEach((f) => { const p = f.t / 0.25; c.strokeStyle = `rgba(246,221,162,${1 - p})`; c.lineWidth = 3; c.beginPath(); c.arc(f.x, f.y, f.r * (0.5 + p * 0.6), 0, Math.PI * 2); c.stroke(); c.fillStyle = `rgba(255,255,255,${1 - p})`; for (let k = 0; k < 5; k++) { const a = k * 1.2566 + p, d = f.r * (0.7 + p * 0.8), x = f.x + Math.cos(a) * d, y = f.y + Math.sin(a) * d, z = 3 + 3 * (1 - p); c.beginPath(); c.moveTo(x, y - z); c.lineTo(x + z * 0.3, y - z * 0.3); c.lineTo(x + z, y); c.lineTo(x + z * 0.3, y + z * 0.3); c.lineTo(x, y + z); c.lineTo(x - z * 0.3, y + z * 0.3); c.lineTo(x - z, y); c.lineTo(x - z * 0.3, y - z * 0.3); c.closePath(); c.fill(); } });

  }
  // 結果を画像にして共有・保存（スクショと同じ4つ）
  resultCard() {

    const c = cv.getContext('2d'); const info = this.cardInfo();
    c.fillStyle = '#F4EFFA'; c.fillRect(0, 0, 720, 720);
    c.fillStyle = '#FFFFFF'; c.beginPath(); c.roundRect(40, 40, 640, 640, 44); c.fill();
    c.textAlign = 'center'; c.fillStyle = '#5B3F94'; c.font = '700 40px sans-serif'; c.fillText(info.title, 360, 118);
    c.save(); c.translate(360, 290); c.scale(3.2, 3.2); info.draw(c); c.restore();
    c.fillStyle = '#6E6684'; c.font = '700 28px sans-serif'; c.fillText(info.sub, 360, 470);
    c.fillStyle = '#2B2640'; c.font = '700 96px sans-serif'; c.fillText(Number(info.score).toLocaleString(), 360, 575);
    c.fillStyle = '#9D98A6'; c.font = '700 24px sans-serif'; c.fillText('#ねこアプリ', 360, 638);

  }
  shareRes(where) {
    const info = this.cardInfo();
    const text = `${info.title}で ${Number(info.score).toLocaleString()} 点！ #ねこアプリ`;
    let cv; try { cv = this.resultCard(); } catch (e) { return; }
    if (where === 'dl') {
      const a = document.createElement('a'); a.href = cv.toDataURL('image/png'); a.download = info.file; document.body.appendChild(a); a.click(); a.remove();

    cv.toBlob((blob) => {
      try {
        const file = new File([blob], info.file, { type: 'image/png' });

  }
  cardInfo() {
    const lv = this.state.top || 0;
    return { title: 'ぷにぷにきゃっとドロップ', score: this.state.score, sub: CATS[lv].name + ' まで育ったよ', file: 'maruneko-score.png',
      draw: (c) => drawCat(c, lv, 32, 0) };
  }
  payNow(cost) {

    const S = this.state; if (S.kari < cost) return;

  }

  // ---- 音（BGMは盛り上がりに合わせて楽器が重なっていく） ----

    if (this.mute) return null;

  }

  // BGM：遊びはじめで最初から流す。あそびかたを開くと止めて、とじると続きから。おしまいで止める。音量画面のあいだは流したまま

  bgmVol() { const v = this.vol.bgm / 100; if (this._bgmG) this._bgmG.gain.value = v; else if (this._bgm) this._bgm.volume = Math.min(1, v); }

    if (!!reach !== this.au.reach) this.au.setReach(!!reach, 2.5);
  }
  renderVals() {

      ? { modal: '#2A2533', bg: '#1B1822', surface: '#353042', border: '#433D52', ink: '#ECEBF0', sub: '#9D98A6', soft: '#353042', accent: '#595266', box: '#3A3446', boxEdge: '#5A5468' }

      kariLabel: S.kari.toLocaleString('ja-JP'), bumpAn: S.bump2 ? 'kari-bump 0.4s ease-out' : 'none', flyOn: !!S.fly,
      ...(() => {
        const plays = getPlays(GID), sub = isSub();
        const extra = plays >= PLAY_FREE, canAd = extra && getAdPlays(GID) < AD_PLAY_MAX;   // 広告なしプランも4回目からは同じ。動画のかわりにそのまま遊べる（1日3回まで）
        const idle = !S.paid && !S.over && !S.adOn;
        return {
          gateOn: idle, subOn: false, subTitle: '', gateNormal: !extra, gateExtra: extra, gateCanAd: canAd, gateAdBanner: canAd && !sub, adIcon: !sub, adLabel: sub ? 'はじめる' : '動画を見て遊ぶ',
          gateNo: S.kari < ENTRY, gateBg: S.kari < ENTRY ? t.sub : (t.accent === '#595266' ? '#8E6A9E' : t.accent),
          gateBtn: S.kari < ENTRY ? 'カリカリが足りないよ' : 'はじめる',

          payShort: S.kari < ENTRY_PAY, goCharge: () => { if (this.props.onCharge) this.props.onCharge(); }, markCharge: () => { try { window.sessionStorage.setItem('chargeFrom', 'CatDrop.dc.html'); } catch (e) {} },
          payNo: S.kari < ENTRY_PAY, payLine: S.kari < ENTRY_PAY ? t.border : '#5B3F94', payFg: S.kari < ENTRY_PAY ? t.sub : t.ink, playPay: () => { if (S.kari < ENTRY_PAY) return; this.payNow(ENTRY_PAY); },

      })(),
      adOn: !!S.adOn, adLeft: S.adLeft || 0, adWait: !!S.adOn && S.adLeft > 0, adDone: !!S.adOn && !(S.adLeft > 0), adPct: `${Math.round((1 - (S.adLeft || 0) / AD_SEC) * 100)}%`,
      closeAd: () => this.finishAd(),
      soundOn: String(!S.mute), soundLabel: S.mute ? '音を出す' : '音を消す', soundPath: S.mute ? 'M16 9.5l5 5M21 9.5l-5 5' : 'M15.5 9a4.5 4.5 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11',
      toggleSound: () => { const m = !S.mute; this.mute = m; this.au.setMuted(m); if (m) this.au.stop(); else this.audio(); try { window.localStorage.setItem('miniMute', m ? '1' : '0'); } catch (e) {} this.setState({ mute: m }); },
      goPremium: () => { if (this.props.onPremium) this.props.onPremium(); }, markPremium: () => { try { window.sessionStorage.setItem('premiumFrom', 'CatDrop.dc.html'); } catch (e) {} },
      joinSub: () => { try { window.localStorage.setItem('premium', '1'); } catch (e) {} this.setState({ subTick: Date.now() }); },

      shakeBtn: () => { try { if (window.DeviceMotionEvent && typeof window.DeviceMotionEvent.requestPermission === 'function') window.DeviceMotionEvent.requestPermission().catch(() => {}); } catch (e) {} this.shake((Math.random() - 0.5) * 10, 8, 18); this.setState({ wig: (S.wig || 0) + 1 }); },
